<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner PRO - Détection Ultra-Robuste</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      color: white;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.3);
    }

    .header h1 {
      font-size: 1.8rem;
      margin-bottom: 5px;
    }

    .header .subtitle {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .status {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .status.connected {
      background: rgba(16, 185, 129, 0.3);
    }

    .main {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .video-container {
      position: relative;
      border-radius: 15px;
      overflow: hidden;
      margin: 20px 0;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      background: #000;
    }

    #video {
      width: 100%;
      height: auto;
      display: block;
    }

    #canvas {
      display: none;
    }

    .overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      border: 3px solid rgba(255,255,255,0.5);
      border-radius: 20px;
      pointer-events: none;
    }

    .overlay::before {
      content: '';
      position: absolute;
      top: -3px;
      left: -3px;
      right: -3px;
      bottom: -3px;
      border: 3px solid #00ff00;
      border-radius: 20px;
      opacity: 0;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .controls {
      display: flex;
      gap: 10px;
      margin: 20px 0;
      flex-wrap: wrap;
    }

    .btn {
      flex: 1;
      min-width: 120px;
      padding: 12px 20px;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn:hover {
      background: rgba(255,255,255,0.3);
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn.active {
      background: rgba(16, 185, 129, 0.5);
    }

    .last-scan {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
      backdrop-filter: blur(10px);
      display: none;
    }

    .last-scan.show {
      display: block;
    }

    .last-scan h2 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .qr-value {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 10px;
      word-break: break-all;
      font-family: monospace;
      margin-top: 10px;
    }

    .stats {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .stat-box {
      flex: 1;
      min-width: 100px;
      background: rgba(255,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-box .number {
      font-size: 1.5rem;
      font-weight: bold;
      display: block;
    }

    .stat-box .label {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .processing-info {
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 8px;
      margin: 10px 0;
      font-size: 0.85rem;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 Scanner PRO</h1>
    <div class="subtitle">Détection ultra-robuste avec jsQR + traitement d'image</div>
    <div class="status" id="connection-status">🔴 Connexion...</div>
  </div>

  <div class="main">
    <div class="video-container">
      <video id="video" autoplay playsinline></video>
      <div class="overlay"></div>
      <canvas id="canvas"></canvas>
    </div>

    <div class="controls">
      <button class="btn" id="enhance-btn">🎨 Amélioration: OFF</button>
      <button class="btn" id="zoom-btn">🔎 Zoom: x1</button>
    </div>

    <div class="processing-info" id="processing-info">
      FPS: 0 | Tentatives: 0 | Résolution: 0x0
    </div>

    <div class="last-scan" id="last-scan">
      <h2>✅ QR Code détecté</h2>
      <div class="qr-value" id="qr-value"></div>
      <div id="timestamp"></div>
    </div>

    <div class="stats">
      <div class="stat-box">
        <span class="number" id="scan-count">0</span>
        <span class="label">Scans</span>
      </div>
      <div class="stat-box">
        <span class="number" id="fps-count">0</span>
        <span class="label">FPS</span>
      </div>
      <div class="stat-box">
        <span class="number" id="connected-clients">0</span>
        <span class="label">Connectés</span>
      </div>
    </div>

    <a href="/" class="btn" style="display:block;margin-top:20px;text-align:center;text-decoration:none;">← Retour</a>
  </div>

  <script>
    const socket = io();
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let isScanning = true;
    let lastScan = null;
    let scanCooldown = 2000;
    let enhanceMode = false;
    let zoomLevel = 1;
    let frameCount = 0;
    let lastFpsTime = Date.now();
    let attempts = 0;

    // WebSocket
    socket.on('connect', () => {
      document.getElementById('connection-status').textContent = '🟢 Connecté';
      document.getElementById('connection-status').classList.add('connected');
    });

    socket.on('disconnect', () => {
      document.getElementById('connection-status').textContent = '🔴 Déconnecté';
      document.getElementById('connection-status').classList.remove('connected');
    });

    socket.on('stats-update', (stats) => {
      document.getElementById('scan-count').textContent = stats.scanCount;
      document.getElementById('connected-clients').textContent = stats.connectedClients;
    });

    // Contrôles
    document.getElementById('enhance-btn').addEventListener('click', () => {
      enhanceMode = !enhanceMode;
      document.getElementById('enhance-btn').textContent = enhanceMode ? '🎨 Amélioration: ON' : '🎨 Amélioration: OFF';
      document.getElementById('enhance-btn').classList.toggle('active', enhanceMode);
    });

    document.getElementById('zoom-btn').addEventListener('click', () => {
      zoomLevel = zoomLevel === 1 ? 2 : zoomLevel === 2 ? 3 : 1;
      document.getElementById('zoom-btn').textContent = `🔎 Zoom: x${zoomLevel}`;
    });

    // Traitement d'image ultra-poussé pour QR codes difficiles
    function enhanceImage(imageData) {
      const data = imageData.data;
      const width = imageData.width;
      const height = imageData.height;

      // Passe 1: Conversion en niveaux de gris avec pondération
      const grayData = new Uint8ClampedArray(width * height);
      for (let i = 0; i < data.length; i += 4) {
        const idx = i / 4;
        // Pondération pour meilleure perception (0.299R + 0.587G + 0.114B)
        grayData[idx] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
      }

      // Passe 2: Filtre médian pour réduire le bruit
      const medianData = new Uint8ClampedArray(width * height);
      for (let y = 1; y < height - 1; y++) {
        for (let x = 1; x < width - 1; x++) {
          const idx = y * width + x;
          const neighbors = [
            grayData[idx - width - 1], grayData[idx - width], grayData[idx - width + 1],
            grayData[idx - 1], grayData[idx], grayData[idx + 1],
            grayData[idx + width - 1], grayData[idx + width], grayData[idx + width + 1]
          ];
          neighbors.sort((a, b) => a - b);
          medianData[idx] = neighbors[4]; // Médiane
        }
      }

      // Passe 3: Égalisation d'histogramme pour améliorer le contraste
      const histogram = new Array(256).fill(0);
      for (let i = 0; i < medianData.length; i++) {
        histogram[medianData[i]]++;
      }

      const cdf = new Array(256);
      cdf[0] = histogram[0];
      for (let i = 1; i < 256; i++) {
        cdf[i] = cdf[i - 1] + histogram[i];
      }

      const cdfMin = cdf.find(v => v > 0);
      const equalizedData = new Uint8ClampedArray(width * height);
      for (let i = 0; i < medianData.length; i++) {
        equalizedData[i] = Math.round(((cdf[medianData[i]] - cdfMin) / (width * height - cdfMin)) * 255);
      }

      // Passe 4: Binarisation adaptative (méthode de Sauvola)
      const windowSize = 15;
      const k = 0.5;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const idx = y * width + x;

          // Calculer moyenne et écart-type local
          let sum = 0, sumSq = 0, count = 0;
          for (let wy = Math.max(0, y - windowSize); wy < Math.min(height, y + windowSize); wy++) {
            for (let wx = Math.max(0, x - windowSize); wx < Math.min(width, x + windowSize); wx++) {
              const widx = wy * width + wx;
              sum += equalizedData[widx];
              sumSq += equalizedData[widx] * equalizedData[widx];
              count++;
            }
          }

          const mean = sum / count;
          const variance = (sumSq / count) - (mean * mean);
          const stdDev = Math.sqrt(variance);
          const threshold = mean * (1 + k * ((stdDev / 128) - 1));

          const pixelIdx = idx * 4;
          const value = equalizedData[idx] > threshold ? 255 : 0;
          data[pixelIdx] = data[pixelIdx + 1] = data[pixelIdx + 2] = value;
        }
      }

      return imageData;
    }

    // Fonction de scan
    function scanFrame() {
      if (!isScanning) {
        requestAnimationFrame(scanFrame);
        return;
      }

      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // Ajuster la taille du canvas selon le zoom
        const baseWidth = video.videoWidth;
        const baseHeight = video.videoHeight;

        canvas.width = baseWidth;
        canvas.height = baseHeight;

        // Dessiner l'image avec zoom si activé
        if (zoomLevel > 1) {
          const scaledWidth = baseWidth / zoomLevel;
          const scaledHeight = baseHeight / zoomLevel;
          const offsetX = (baseWidth - scaledWidth) / 2;
          const offsetY = (baseHeight - scaledHeight) / 2;

          ctx.drawImage(video, offsetX, offsetY, scaledWidth, scaledHeight, 0, 0, baseWidth, baseHeight);
        } else {
          ctx.drawImage(video, 0, 0, baseWidth, baseHeight);
        }

        let imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

        // Appliquer l'amélioration si activée
        if (enhanceMode) {
          imageData = enhanceImage(imageData);
          ctx.putImageData(imageData, 0, 0);
          imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        attempts++;

        // Détecter le QR code avec jsQR
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: "dontInvert",
        });

        if (code) {
          handleQRCode(code.data);
        }

        // Calculer FPS
        frameCount++;
        const now = Date.now();
        if (now - lastFpsTime >= 1000) {
          document.getElementById('fps-count').textContent = frameCount;
          document.getElementById('processing-info').textContent =
            `FPS: ${frameCount} | Tentatives: ${attempts} | Résolution: ${canvas.width}x${canvas.height}`;
          frameCount = 0;
          attempts = 0;
          lastFpsTime = now;
        }
      }

      requestAnimationFrame(scanFrame);
    }

    // Gestion QR code détecté
    function handleQRCode(data) {
      const now = Date.now();

      if (lastScan && lastScan.data === data && now - lastScan.time < scanCooldown) {
        return;
      }

      lastScan = { data, time: now };

      // Afficher
      document.getElementById('last-scan').classList.add('show');
      document.getElementById('qr-value').textContent = data;
      document.getElementById('timestamp').textContent = new Date().toLocaleString();

      // Envoyer au serveur
      socket.emit('qr-scanned', {
        value: data,
        timestamp: Date.now()
      });

      console.log('✅ QR détecté:', data);

      // Feedback visuel
      document.querySelector('.overlay').style.borderColor = '#00ff00';
      setTimeout(() => {
        document.querySelector('.overlay').style.borderColor = 'rgba(255,255,255,0.5)';
      }, 500);
    }

    // Démarrer la caméra avec la meilleure résolution possible
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment",
        width: { ideal: 3840 },  // 4K si disponible
        height: { ideal: 2160 },
        focusMode: { ideal: "continuous" }
      }
    }).then(stream => {
      video.srcObject = stream;
      video.play();

      video.onloadedmetadata = () => {
        console.log(`✅ Caméra démarrée: ${video.videoWidth}x${video.videoHeight}`);
        scanFrame();
      };
    }).catch(err => {
      console.error('❌ Erreur caméra:', err);
      alert('Impossible d\'accéder à la caméra: ' + err.message);
    });
  </script>
</body>
</html>
