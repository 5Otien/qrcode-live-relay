<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR - Nimiq</title>
  <script type="module">
    import QrScanner from 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.min.js';
    window.QrScanner = QrScanner;
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      min-height: 100vh;
    }
    .header {
      padding: 20px;
      background: rgba(0,0,0,0.3);
      text-align: center;
      border-bottom: 3px solid #0f0;
      backdrop-filter: blur(10px);
    }
    h1 {
      color: #0f0;
      font-size: 1.8rem;
      margin-bottom: 10px;
      text-shadow: 0 0 10px rgba(0,255,0,0.5);
    }
    .tech-info {
      font-size: 0.85rem;
      color: #0ff;
      margin-top: 8px;
    }
    .tech-badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0,255,0,0.2);
      border: 1px solid #0f0;
      border-radius: 4px;
      font-size: 0.75rem;
      margin: 5px 3px;
    }
    .status {
      display: inline-block;
      padding: 6px 20px;
      background: #f00;
      border-radius: 20px;
      margin-top: 10px;
      font-size: 0.9rem;
      font-weight: bold;
    }
    .status.ok { background: #0f0; color: #000; }
    .container { padding: 20px; max-width: 800px; margin: 0 auto; }

    .video-container {
      position: relative;
      border: 3px solid #0f0;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,255,0,0.3);
      background: #000;
    }
    #video {
      width: 100%;
      display: block;
    }
    .scan-region {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 250px;
      height: 250px;
      border: 3px solid #0ff;
      border-radius: 10px;
      pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
    }
    .scan-region::before,
    .scan-region::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      border: 3px solid #0f0;
    }
    .scan-region::before {
      top: -3px;
      left: -3px;
      border-right: none;
      border-bottom: none;
    }
    .scan-region::after {
      bottom: -3px;
      right: -3px;
      border-left: none;
      border-top: none;
    }
    .scan-line {
      position: absolute;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #0f0, transparent);
      animation: scan 2s linear infinite;
      box-shadow: 0 0 10px #0f0;
    }
    @keyframes scan {
      0%, 100% { top: 0; }
      50% { top: 100%; }
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: rgba(0,255,0,0.1);
      border: 2px solid #0f0;
      border-radius: 12px;
      display: none;
      animation: slideIn 0.3s;
    }
    .result.show { display: block; }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .result h3 {
      color: #0f0;
      margin-bottom: 15px;
      font-size: 1.2rem;
    }
    .qr-data {
      background: rgba(0,0,0,0.5);
      padding: 15px;
      border-radius: 8px;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      color: #0ff;
      border-left: 4px solid #0f0;
      max-height: 100px;
      overflow-y: auto;
    }
    .result-info {
      margin-top: 10px;
      font-size: 0.85rem;
      opacity: 0.8;
      color: #0ff;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 20px;
    }
    .stat {
      background: rgba(0,255,255,0.1);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      border: 2px solid rgba(0,255,255,0.3);
    }
    .stat-val {
      display: block;
      font-size: 2rem;
      color: #0ff;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(0,255,255,0.5);
    }
    .stat-lbl {
      font-size: 0.8rem;
      opacity: 0.8;
      margin-top: 5px;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .btn {
      flex: 1;
      padding: 15px;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(45deg, #0f0, #0a0);
      color: #000;
      box-shadow: 0 0 20px rgba(0,255,0,0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0,255,0,0.6);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.1);
      color: white;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .btn-secondary:hover {
      background: rgba(255,255,255,0.2);
    }

    .api-info {
      margin-top: 20px;
      padding: 15px;
      background: rgba(0,100,255,0.1);
      border: 1px solid rgba(0,100,255,0.3);
      border-radius: 8px;
      font-size: 0.85rem;
      color: #0af;
    }
    .api-info.native {
      background: rgba(0,255,0,0.1);
      border-color: rgba(0,255,0,0.3);
      color: #0f0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ SCANNER QR ULTRA-RAPIDE</h1>
    <div class="tech-info">Powered by Nimiq QR Scanner</div>
    <div>
      <span class="tech-badge">Native API</span>
      <span class="tech-badge">WebWorker</span>
      <span class="tech-badge">8x Plus Rapide</span>
    </div>
    <div class="status" id="status">⚫ Initialisation...</div>
  </div>

  <div class="container">
    <div class="video-container">
      <video id="video" playsinline></video>
      <div class="scan-region">
        <div class="scan-line"></div>
      </div>
    </div>

    <div class="result" id="result">
      <h3>✅ QR CODE DÉTECTÉ</h3>
      <div class="qr-data" id="data"></div>
      <div class="result-info">
        <div id="timestamp"></div>
        <div id="corners"></div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-val" id="fps">0</span>
        <span class="stat-lbl">FPS</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="found">0</span>
        <span class="stat-lbl">DÉTECTIONS</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="scans">0</span>
        <span class="stat-lbl">SCANS</span>
      </div>
    </div>

    <div class="api-info" id="api-info">
      <strong>📊 Détection:</strong> Chargement...
    </div>

    <div class="controls">
      <a href="/" class="btn btn-secondary">← RETOUR</a>
      <button class="btn btn-primary" id="toggle-inversion">🔄 Inversion Couleurs</button>
    </div>
  </div>

  <script type="module">
    const socket = io();
    const video = document.getElementById('video');

    let scanner = null;
    let lastQR = null;
    let cooldown = 1500;
    let found = 0;
    let scans = 0;
    let fpsCount = 0;
    let fpsTime = Date.now();
    let inversionEnabled = false;

    // Socket
    socket.on('connect', () => {
      document.getElementById('status').textContent = '🟢 CONNECTÉ';
      document.getElementById('status').classList.add('ok');
    });

    socket.on('disconnect', () => {
      document.getElementById('status').textContent = '🔴 DÉCONNECTÉ';
      document.getElementById('status').classList.remove('ok');
    });

    // Callback quand QR détecté
    function onScanSuccess(result) {
      scans++;
      document.getElementById('scans').textContent = scans;

      const now = Date.now();
      const data = result.data;

      // Cooldown pour éviter les doublons
      if (lastQR && lastQR.data === data && now - lastQR.time < cooldown) return;

      lastQR = { data, time: now };
      found++;

      // Afficher le résultat
      document.getElementById('result').classList.add('show');
      document.getElementById('data').textContent = data;
      document.getElementById('found').textContent = found;
      document.getElementById('timestamp').textContent = '🕒 ' + new Date().toLocaleString();

      // Afficher les coins détectés si disponibles
      if (result.cornerPoints) {
        const corners = result.cornerPoints.map(p => `(${Math.round(p.x)},${Math.round(p.y)})`).join(' ');
        document.getElementById('corners').textContent = '📍 Coins: ' + corners;
      }

      // Envoyer via socket
      socket.emit('qr-scanned', { value: data, timestamp: now });

      console.log('✅ QR détecté:', data);
      console.log('📊 Résultat complet:', result);

      // FPS
      fpsCount++;
      if (Date.now() - fpsTime >= 1000) {
        document.getElementById('fps').textContent = fpsCount;
        fpsCount = 0;
        fpsTime = Date.now();
      }
    }

    // Toggle inversion des couleurs
    document.getElementById('toggle-inversion').addEventListener('click', () => {
      inversionEnabled = !inversionEnabled;
      if (scanner) {
        scanner.setInversionMode(inversionEnabled ? 'both' : 'original');
        document.getElementById('toggle-inversion').textContent =
          inversionEnabled ? '✅ Inversion ON' : '🔄 Inversion Couleurs';
      }
    });

    // Init scanner
    async function initScanner() {
      try {
        // Vérifier si BarcodeDetector natif est disponible
        const hasNative = 'BarcodeDetector' in window;
        const apiInfo = document.getElementById('api-info');

        if (hasNative) {
          apiInfo.classList.add('native');
          apiInfo.innerHTML = '<strong>🚀 API Native BarcodeDetector:</strong> ACTIVÉE (Performance maximale!)';
        } else {
          apiInfo.innerHTML = '<strong>⚙️ Mode WebAssembly:</strong> Fallback activé (excellentes performances)';
        }

        // Créer le scanner
        scanner = new QrScanner(
          video,
          result => onScanSuccess(result),
          {
            returnDetailedScanResult: true,
            highlightScanRegion: false,
            highlightCodeOutline: false,
            maxScansPerSecond: 10, // Limite à 10 scans/sec pour économiser CPU
            preferredCamera: 'environment' // Caméra arrière
          }
        );

        // Démarrer
        await scanner.start();

        console.log('📷 Scanner démarré!');
        console.log('🔍 API native:', hasNative ? 'OUI' : 'NON');

      } catch (err) {
        console.error('❌ Erreur scanner:', err);
        alert('Erreur: ' + err.message);
        document.getElementById('status').textContent = '❌ ERREUR';
      }
    }

    // Attendre que QrScanner soit chargé
    window.addEventListener('load', () => {
      if (window.QrScanner) {
        // Définir le chemin du worker
        QrScanner.WORKER_PATH = 'https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner-worker.min.js';
        initScanner();
      } else {
        console.error('❌ QrScanner non chargé');
        alert('Erreur de chargement de la bibliothèque QR Scanner');
      }
    });

    // Cleanup
    window.addEventListener('beforeunload', () => {
      if (scanner) scanner.destroy();
    });
  </script>
</body>
</html>
