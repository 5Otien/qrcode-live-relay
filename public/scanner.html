<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR Pro</title>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
    }
    .header {
      padding: 15px;
      background: #111;
      text-align: center;
      border-bottom: 2px solid #0f0;
    }
    h1 { color: #0f0; font-size: 1.5rem; }
    .status {
      display: inline-block;
      padding: 5px 15px;
      background: #f00;
      border-radius: 15px;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    .status.ok { background: #0f0; color: #000; }
    .container { padding: 15px; }
    #video {
      width: 100%;
      border: 3px solid #0f0;
      border-radius: 10px;
    }
    .result {
      margin-top: 15px;
      padding: 15px;
      background: #222;
      border-radius: 10px;
      border: 2px solid #0f0;
      display: none;
    }
    .result.show { display: block; }
    .qr-data {
      background: #000;
      padding: 10px;
      border-radius: 5px;
      word-break: break-all;
      font-family: monospace;
      margin-top: 10px;
      color: #0f0;
    }
    .stats {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .stat {
      flex: 1;
      background: #222;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid #333;
    }
    .stat-val {
      display: block;
      font-size: 1.5rem;
      color: #0f0;
      font-weight: bold;
    }
    .stat-lbl {
      font-size: 0.8rem;
      opacity: 0.7;
    }
    .method {
      font-size: 0.75rem;
      color: #0ff;
      margin-top: 5px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #0f0;
      color: #000;
      text-decoration: none;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🎯 SCANNER QR PRO</h1>
    <div class="status" id="status">⚫ Init...</div>
  </div>

  <div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas" style="display:none;"></canvas>

    <div class="result" id="result">
      <h3>✅ QR CODE DÉTECTÉ</h3>
      <div class="qr-data" id="data"></div>
      <div class="method" id="method"></div>
      <div style="margin-top:8px;font-size:0.8rem;opacity:0.7;" id="time"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-val" id="fps">0</span>
        <span class="stat-lbl">FPS</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="found">0</span>
        <span class="stat-lbl">TROUVÉS</span>
      </div>
      <div class="stat">
        <span class="stat-val" id="method-count">0</span>
        <span class="stat-lbl">ESSAIS</span>
      </div>
    </div>

    <a href="/" class="btn">← RETOUR</a>
  </div>

  <script>
    const socket = io();
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let running = true;
    let lastQR = null;
    let cooldown = 1500;
    let found = 0;
    let fpsCount = 0;
    let fpsTime = Date.now();

    // Socket
    socket.on('connect', () => {
      document.getElementById('status').textContent = '🟢 CONNECTÉ';
      document.getElementById('status').classList.add('ok');
    });

    socket.on('disconnect', () => {
      document.getElementById('status').textContent = '🔴 DÉCONNECTÉ';
      document.getElementById('status').classList.remove('ok');
    });

    // QR trouvé
    function onQR(data, method) {
      const now = Date.now();
      if (lastQR && lastQR.data === data && now - lastQR.time < cooldown) return;

      lastQR = { data, time: now };
      found++;

      document.getElementById('result').classList.add('show');
      document.getElementById('data').textContent = data;
      document.getElementById('method').textContent = '📊 Méthode: ' + method;
      document.getElementById('time').textContent = new Date().toLocaleString();
      document.getElementById('found').textContent = found;

      socket.emit('qr-scanned', { value: data, timestamp: now });
      console.log('QR:', data, 'Méthode:', method);
    }

    // Traitement d'image avancé pour QR codes flous/petits
    function enhanceForQR(imageData) {
      const data = imageData.data;
      const w = imageData.width;
      const h = imageData.height;

      // 1. Calculer le seuil optimal (style Otsu simplifié)
      let histogram = new Array(256).fill(0);
      for (let i = 0; i < data.length; i += 4) {
        const gray = Math.round(data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
        histogram[gray]++;
      }

      // Trouver un bon seuil basé sur l'histogramme
      let sum = 0;
      let total = w * h;
      for (let i = 0; i < 256; i++) sum += i * histogram[i];

      let sumB = 0, wB = 0, wF = 0;
      let maxVariance = 0;
      let threshold = 128;

      for (let i = 0; i < 256; i++) {
        wB += histogram[i];
        if (wB === 0) continue;
        wF = total - wB;
        if (wF === 0) break;

        sumB += i * histogram[i];
        let mB = sumB / wB;
        let mF = (sum - sumB) / wF;
        let variance = wB * wF * (mB - mF) * (mB - mF);

        if (variance > maxVariance) {
          maxVariance = variance;
          threshold = i;
        }
      }

      return threshold;
    }

    // Améliorer le contraste (rendre le noir plus noir, le blanc plus blanc)
    function boostContrast(imageData, factor = 1.8) {
      const enhanced = ctx.createImageData(imageData.width, imageData.height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        // Conversion en niveaux de gris
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;

        // Augmentation du contraste centré sur 128
        let value = ((gray - 128) * factor) + 128;
        value = Math.max(0, Math.min(255, value));

        enhanced.data[i] = enhanced.data[i + 1] = enhanced.data[i + 2] = value;
        enhanced.data[i + 3] = 255;
      }

      return enhanced;
    }

    // Binarisation adaptative
    function adaptiveBinarize(imageData, threshold) {
      const binary = ctx.createImageData(imageData.width, imageData.height);
      const data = imageData.data;

      for (let i = 0; i < data.length; i += 4) {
        const gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        const value = gray > threshold ? 255 : 0;

        binary.data[i] = binary.data[i + 1] = binary.data[i + 2] = value;
        binary.data[i + 3] = 255;
      }

      return binary;
    }

    // Scan avec traitement intelligent
    function scan() {
      if (!running || video.readyState !== video.HAVE_ENOUGH_DATA) {
        requestAnimationFrame(scan);
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0);

      const original = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let methodCount = 0;

      // Méthode 1: Image originale
      methodCount++;
      let qr = jsQR(original.data, original.width, original.height, {
        inversionAttempts: "attemptBoth"
      });
      if (qr) {
        onQR(qr.data, 'Original');
        document.getElementById('method-count').textContent = methodCount;
        fpsCount++;
        if (Date.now() - fpsTime >= 1000) {
          document.getElementById('fps').textContent = fpsCount;
          fpsCount = 0;
          fpsTime = Date.now();
        }
        requestAnimationFrame(scan);
        return;
      }

      // Méthode 2: Contraste boosté (meilleur pour QR flous)
      methodCount++;
      const contrasted = boostContrast(original, 2.0);
      qr = jsQR(contrasted.data, contrasted.width, contrasted.height, {
        inversionAttempts: "attemptBoth"
      });
      if (qr) {
        onQR(qr.data, 'Contraste x2');
        document.getElementById('method-count').textContent = methodCount;
        fpsCount++;
        if (Date.now() - fpsTime >= 1000) {
          document.getElementById('fps').textContent = fpsCount;
          fpsCount = 0;
          fpsTime = Date.now();
        }
        requestAnimationFrame(scan);
        return;
      }

      // Méthode 3: Contraste extrême (pour QR très petits)
      methodCount++;
      const extremeContrast = boostContrast(original, 3.0);
      qr = jsQR(extremeContrast.data, extremeContrast.width, extremeContrast.height, {
        inversionAttempts: "attemptBoth"
      });
      if (qr) {
        onQR(qr.data, 'Contraste x3');
        document.getElementById('method-count').textContent = methodCount;
        fpsCount++;
        if (Date.now() - fpsTime >= 1000) {
          document.getElementById('fps').textContent = fpsCount;
          fpsCount = 0;
          fpsTime = Date.now();
        }
        requestAnimationFrame(scan);
        return;
      }

      // Méthode 4: Binarisation adaptative (seuil auto)
      methodCount++;
      const threshold = enhanceForQR(original);
      const adaptive = adaptiveBinarize(original, threshold);
      qr = jsQR(adaptive.data, adaptive.width, adaptive.height, {
        inversionAttempts: "attemptBoth"
      });
      if (qr) {
        onQR(qr.data, 'Binaire adaptatif');
        document.getElementById('method-count').textContent = methodCount;
        fpsCount++;
        if (Date.now() - fpsTime >= 1000) {
          document.getElementById('fps').textContent = fpsCount;
          fpsCount = 0;
          fpsTime = Date.now();
        }
        requestAnimationFrame(scan);
        return;
      }

      // Méthode 5: Binarisation avec seuil bas (plus de noir)
      methodCount++;
      const lowThreshold = adaptiveBinarize(original, 100);
      qr = jsQR(lowThreshold.data, lowThreshold.width, lowThreshold.height, {
        inversionAttempts: "attemptBoth"
      });
      if (qr) {
        onQR(qr.data, 'Binaire seuil bas');
        document.getElementById('method-count').textContent = methodCount;
        fpsCount++;
        if (Date.now() - fpsTime >= 1000) {
          document.getElementById('fps').textContent = fpsCount;
          fpsCount = 0;
          fpsTime = Date.now();
        }
        requestAnimationFrame(scan);
        return;
      }

      // Méthode 6: Binarisation avec seuil haut (plus de blanc)
      methodCount++;
      const highThreshold = adaptiveBinarize(original, 155);
      qr = jsQR(highThreshold.data, highThreshold.width, highThreshold.height, {
        inversionAttempts: "attemptBoth"
      });
      if (qr) {
        onQR(qr.data, 'Binaire seuil haut');
        document.getElementById('method-count').textContent = methodCount;
        fpsCount++;
        if (Date.now() - fpsTime >= 1000) {
          document.getElementById('fps').textContent = fpsCount;
          fpsCount = 0;
          fpsTime = Date.now();
        }
        requestAnimationFrame(scan);
        return;
      }

      document.getElementById('method-count').textContent = methodCount;

      // Stats FPS
      fpsCount++;
      if (Date.now() - fpsTime >= 1000) {
        document.getElementById('fps').textContent = fpsCount;
        fpsCount = 0;
        fpsTime = Date.now();
      }

      requestAnimationFrame(scan);
    }

    // Init
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      }
    }).then(stream => {
      video.srcObject = stream;
      video.play().then(() => {
        console.log('📷 Caméra:', video.videoWidth, 'x', video.videoHeight);
        console.log('🔍 6 méthodes de traitement d\'image activées');
        scan();
      });
    }).catch(err => {
      alert('Erreur caméra: ' + err.message);
    });
  </script>
</body>
</html>
