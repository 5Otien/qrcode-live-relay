<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner FINAL - Ultra-Optimisé</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: white;
      min-height: 100vh;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: rgba(0,0,0,0.5);
      border-bottom: 2px solid #00d4ff;
    }

    h1 {
      font-size: 1.8rem;
      color: #00d4ff;
      margin-bottom: 10px;
    }

    .status {
      padding: 8px 16px;
      background: rgba(255,0,0,0.3);
      border-radius: 20px;
      display: inline-block;
      margin-top: 10px;
    }

    .status.ok {
      background: rgba(0,255,0,0.3);
    }

    .container {
      max-width: 100%;
      padding: 20px;
    }

    #video {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,212,255,0.3);
    }

    #canvas {
      display: none;
    }

    .result {
      margin-top: 20px;
      padding: 20px;
      background: rgba(0,212,255,0.2);
      border-radius: 10px;
      border: 2px solid #00d4ff;
      display: none;
    }

    .result.show {
      display: block;
      animation: slideIn 0.3s;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .qr-data {
      background: rgba(0,0,0,0.5);
      padding: 15px;
      border-radius: 5px;
      word-break: break-all;
      font-family: monospace;
      margin-top: 10px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .stat {
      background: rgba(0,0,0,0.3);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .stat-value {
      display: block;
      font-size: 2rem;
      font-weight: bold;
      color: #00d4ff;
    }

    .stat-label {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .info {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,165,0,0.2);
      border-radius: 10px;
      border-left: 4px solid orange;
      font-size: 0.9rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      background: linear-gradient(45deg, #00d4ff, #0080ff);
      color: white;
      text-decoration: none;
      text-align: center;
      border-radius: 10px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📸 SCANNER FINAL</h1>
    <p style="opacity: 0.8; font-size: 0.9rem;">Version ultra-simple et robuste</p>
    <div class="status" id="status">🔴 Initialisation...</div>
  </div>

  <div class="container">
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <div class="result" id="result">
      <h3>✅ QR CODE DÉTECTÉ</h3>
      <div class="qr-data" id="qr-data"></div>
      <div style="margin-top: 10px; opacity: 0.8; font-size: 0.9rem;" id="timestamp"></div>
    </div>

    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="fps">0</span>
        <span class="stat-label">FPS</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="scans">0</span>
        <span class="stat-label">Détections</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="attempts">0</span>
        <span class="stat-label">Tentatives</span>
      </div>
    </div>

    <div class="info">
      <strong>ℹ️ Instructions :</strong><br>
      1. Pointez la caméra vers un QR code<br>
      2. Tenez-le stable et bien éclairé<br>
      3. La détection est automatique<br>
      4. Pas de zoom ni bouton nécessaire
    </div>

    <a href="/" class="btn">← RETOUR MENU</a>
  </div>

  <script>
    const socket = io();
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // Web Worker pour traitement en parallèle
    const workers = [];
    const workerCount = 3; // 3 workers en parallèle
    let currentWorker = 0;
    let processingJob = null;
    let jobId = 0;

    // Créer les workers
    for (let i = 0; i < workerCount; i++) {
      const worker = new Worker('/js/qr-worker.js');
      worker.onmessage = handleWorkerResult;
      workers.push(worker);
    }

    let scanning = true;
    let lastScan = null;
    let cooldown = 1500;
    let detections = 0;
    let frameCount = 0;
    let attemptCount = 0;
    let lastFpsTime = Date.now();

    // Socket.IO
    socket.on('connect', () => {
      document.getElementById('status').textContent = '🟢 Connecté';
      document.getElementById('status').classList.add('ok');
    });

    socket.on('disconnect', () => {
      document.getElementById('status').textContent = '🔴 Déconnecté';
      document.getElementById('status').classList.remove('ok');
    });

    // Résultat du worker
    function handleWorkerResult(e) {
      const { success, data, method, jobId: resultJobId } = e.data;

      if (success && data) {
        handleQR(data, method);
      }

      processingJob = null;
    }

    // Détection QR
    function handleQR(data, method) {
      const now = Date.now();

      if (lastScan && lastScan.data === data && now - lastScan.time < cooldown) {
        return;
      }

      lastScan = { data, time: now };
      detections++;

      // Affichage
      document.getElementById('result').classList.add('show');
      document.getElementById('qr-data').textContent = data;
      document.getElementById('timestamp').textContent = new Date().toLocaleString() + ` (${method})`;
      document.getElementById('scans').textContent = detections;

      // Envoi serveur
      socket.emit('qr-scanned', {
        value: data,
        timestamp: Date.now()
      });

      console.log('✅ QR:', data, 'Méthode:', method);
    }

    // Scan loop optimisé
    function scan() {
      if (!scanning || video.readyState !== video.HAVE_ENOUGH_DATA) {
        requestAnimationFrame(scan);
        return;
      }

      // Si un job est en cours, passer cette frame
      if (processingJob !== null) {
        requestAnimationFrame(scan);
        return;
      }

      // Capture haute résolution
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

      // Envoyer au worker (rotation entre workers)
      const worker = workers[currentWorker];
      currentWorker = (currentWorker + 1) % workerCount;

      processingJob = ++jobId;
      attemptCount++;

      worker.postMessage({
        imageData: imageData.data,
        width: imageData.width,
        height: imageData.height,
        jobId: processingJob
      }, [imageData.data.buffer]); // Transfer ownership pour perf

      // Stats
      frameCount++;
      const now = Date.now();
      if (now - lastFpsTime >= 1000) {
        document.getElementById('fps').textContent = frameCount;
        document.getElementById('attempts').textContent = attemptCount;
        frameCount = 0;
        attemptCount = 0;
        lastFpsTime = now;
      }

      requestAnimationFrame(scan);
    }

    // Init
    async function init() {
      try {
        console.log('🚀 Démarrage caméra haute résolution...');

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width: { ideal: 3840, min: 1920 },
            height: { ideal: 2160, min: 1080 },
            frameRate: { ideal: 60, min: 30 }
          }
        });

        video.srcObject = stream;
        await video.play();

        console.log('✅ Caméra:', video.videoWidth, 'x', video.videoHeight);
        console.log('✅ Workers:', workerCount, 'threads');

        scan();

      } catch (err) {
        console.error('❌ Erreur:', err);
        alert('Erreur caméra: ' + err.message);
      }
    }

    init();
  </script>
</body>
</html>
